checklist:
    extra_categories: []
fab_version: 2.13.6
project:
    description: Backlog idea management CLI (extracted from fab-kit) — worktree-aware tracker for per-repo idea lists.
    name: idea
providers:
    claude:
        session_command: claude --dangerously-skip-permissions --effort xhigh -n "$(basename "$(pwd)")"
source_paths:
    - src/cmd/idea
    - src/internal/idea
    - scripts
test_paths:
    - '**/*_test.go'
true_impact_exclude:
    - fab/
    - docs/
