agent:
    spawn_command: claude --dangerously-skip-permissions --effort xhigh -n "$(basename "$(pwd)")"
checklist:
    extra_categories: []
fab_version: 2.0.1
project:
    description: Backlog idea management CLI (extracted from fab-kit) — worktree-aware tracker for per-repo idea lists.
    name: idea
source_paths:
    - src/go/idea
    - scripts
true_impact_exclude: [fab/, docs/]
stage_directives:
    apply:
        - Follow Go standard formatting (gofmt)
        - Prefer table-driven tests over per-case test functions
        - Keep cobra subcommand files small; push logic into internal/idea
        - Use GIVEN/WHEN/THEN for scenarios
        - Mark ambiguities with [NEEDS CLARIFICATION]
    hydrate: []
    intake: []
    review: []
